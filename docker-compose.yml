services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storywriter_app
    restart: unless-stopped
    volumes:
      - .:/var/www
      - ./database:/var/www/database
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
    networks:
      - storywriter

  web:
    image: nginx:alpine
    container_name: storywriter_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - storywriter

networks:
  storywriter:
    driver: bridge