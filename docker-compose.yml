services:
  # PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storywriter_app
    restart: unless-stopped
    volumes:
      - .:/var/www
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
    networks:
      - storywriter
    command: >
      sh -c "php artisan storage:link && php-fpm"

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: storywriter_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - storywriter

  # Node for asset compilation
  node:
    image: node:18
    container_name: storywriter_node
    volumes:
      - .:/var/www
    working_dir: /var/www
    command: >
      sh -c "npm install && npm run dev"
    networks:
      - storywriter

networks:
  storywriter:
    driver: bridge